<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxionics Repositories</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">
    <div class="max-w-6xl mx-auto px-4 py-10">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">Hello</h1>
            <p class="text-slate-400 mt-2">GitHub repositories from @Fluxionics</p>
        </header>

        <div id="repos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">Loading repositories...</div>
        </div>
    </div>

    <!-- Modal para ver el README -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl max-h-[85vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-950">
                <h3 id="modal-title" class="font-bold text-lg text-indigo-400 truncate">README</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto prose prose-invert max-w-none text-slate-300">
                Loading README...
            </div>
        </div>
    </div>

    <script>
        async function fetchRepos() {
            const container = document.getElementById('repos');
            try {
                const res = await fetch('https://api.github.com/users/Fluxionics/repos?sort=updated');
                const repos = await res.json();

                if (!Array.isArray(repos)) throw new Error();

                container.innerHTML = repos.map(repo => `
                    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-6 flex flex-col justify-between hover:border-indigo-500/50 transition-all duration-300 shadow-lg hover:shadow-indigo-500/10">
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-3">
                                <h2 class="font-bold text-lg text-white truncate"><a href="${repo.html_url}" target="_blank" class="hover:text-indigo-400 transition">${repo.name}</a></h2>
                                ${repo.language ? `<span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shrink-0 font-medium">${repo.language}</span>` : ''}
                            </div>
                            <p class="text-slate-400 text-sm line-clamp-2 mb-4">${repo.description || 'No description provided.'}</p>
                        </div>
                        <div class="flex items-center justify-between pt-4 border-t border-slate-800/60 mt-auto text-xs text-slate-400">
                            <div class="flex items-center gap-3">
                                <span>⭐ ${repo.stargazers_count}</span>
                                <span>🍴 ${repo.forks_count}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openReadme('${repo.owner.login}', '${repo.name}')" class="px-3 py-1.5 bg-slate-800 hover:bg-indigo-600 hover:text-white rounded-lg transition font-medium text-slate-300 cursor-pointer">README</button>
                                <a href="${repo.html_url}" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition font-medium">GitHub</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-rose-400">Error loading repositories.</div>';
            }
        }

        async function openReadme(owner, repo) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalTitle.innerText = `${repo} / README.md`;
            modalBody.innerHTML = '<div class="text-center py-8 text-slate-500">Loading README...</div>';
            modal.classList.remove('hidden');

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/readme`);
                const data = await res.json();
                if (data && data.content) {
                    const markdown = atob(data.content);
                    modalBody.innerHTML = marked.parse(markdown);
                } else {
                    modalBody.innerHTML = '<p class="text-slate-500 italic text-center py-8">This repository does not have a README.md</p>';
                }
            } catch (e) {
                modalBody.innerHTML = '<p class="text-slate-500 italic text-center py-8">Could not load README.md</p>';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        fetchRepos();
    </script>
</body>
</html>
