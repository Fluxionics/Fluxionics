<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxionics Repos</title>
</head>
<body>
    <h1>Hello</h1>
    <div id="repos">Loading repos...</div>

    <script>
        fetch('https://api.github.com/users/Fluxionics/repos')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('repos');
                if (Array.isArray(data)) {
                    container.innerHTML = '<ul>' + data.map(repo => `<li><a href="${repo.html_url}" target="_blank">${repo.name}</a></li>`).join('') + '</ul>';
                } else {
                    container.innerHTML = 'Could not load repositories.';
                }
            })
            .catch(() => {
                document.getElementById('repos').innerText = 'Error loading repositories.';
            });
    </script>
</body>
</html>
